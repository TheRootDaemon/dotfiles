# palette
moon="#191724"
text="#e0def4"
love="#eb6f92"

# status bar opts
set -g status-interval 5
set -g status-bg "${moon}"
set -g status-fg "${text}"
set -g status-left "  "
set -g status-position top

set -g status-right "\
#{?client_prefix,#[fg=${love}],}\
#[italics]#S#[noitalics]@%H:%M   \
#[noitalics]\
#(free -h | awk '/^Mem:/ {print $3 \"/\" $2}')  "

set -g window-status-format "\
#{?client_prefix,#[fg=${love}],}\
#I:#[italics]#W "

set -g window-status-current-format "\
#{?client_prefix,#[fg=${love}],}\
#I:#[bold,italics]#W#[fg=${love}]*"

# ctrl-s as the prefix
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# opts
set -g mouse on
set -g set-clipboard on
set -ga terminal-overrides ",*:RGB"
set -g default-terminal "tmux-256color"

# copy mode
setw -g mode-keys vi
bind y copy-mode

# indexing starts from 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-window-option -g pane-base-index 1

# motions (panes)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# motions (windows)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


# motions splits
unbind %
unbind '"'
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# resize panes
bind-key -n -r M-H resize-pane -L 2
bind-key -n -r M-J resize-pane -D 2
bind-key -n -r M-K resize-pane -U 2
bind-key -n -r M-L resize-pane -R 2

# reloads the configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf\; display "config reloaded..."
